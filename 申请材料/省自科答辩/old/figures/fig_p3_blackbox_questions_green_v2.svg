<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="1100" height="540" fill="#ffffff"/>

  <!-- left: mature black box -->
  <text x="260" y="100" font-size="20" font-weight="700" fill="#333" text-anchor="middle">"怎么算" —— 已经很成熟</text>
  <rect x="80" y="180" width="360" height="120" rx="14" fill="#194D36"/>
  <text x="260" y="232" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">量子化学程序</text>
  <text x="260" y="260" font-size="14.5" fill="#E6F3E3" text-anchor="middle">Gaussian · ORCA · xTB</text>
  <rect x="30" y="205" width="70" height="44" rx="8" fill="#F4F9EF" stroke="#A9C9A5"/>
  <text x="65" y="233" font-size="14" fill="#194D36" text-anchor="middle">输入</text>
  <rect x="420" y="205" width="70" height="44" rx="8" fill="#F4F9EF" stroke="#A9C9A5"/>
  <text x="455" y="233" font-size="14" fill="#194D36" text-anchor="middle">输出</text>
  <g font-size="15.5" fill="#287B54">
    <text x="100" y="345">✓ 结构优化</text>
    <text x="100" y="375">✓ 频率分析</text>
    <text x="280" y="345">✓ 能量计算</text>
    <text x="280" y="375">✓ 过渡态搜索</text>
  </g>

  <!-- right: open questions -->
  <text x="800" y="100" font-size="20" font-weight="700" fill="#B54B49" text-anchor="middle">"算什么" —— 仍然依赖人</text>
  <g font-size="17" fill="#806511" font-weight="600">
    <rect x="590" y="140" width="250" height="46" rx="23" fill="#FFF9E8" stroke="#D4A921"/>
    <text x="715" y="170" text-anchor="middle">研究哪条反应路径？</text>
    <rect x="810" y="200" width="250" height="46" rx="23" fill="#FFF9E8" stroke="#D4A921"/>
    <text x="935" y="230" text-anchor="middle">用哪一个构象？</text>
    <rect x="590" y="260" width="250" height="46" rx="23" fill="#FFF9E8" stroke="#D4A921"/>
    <text x="715" y="290" text-anchor="middle">三维结构怎么建？</text>
    <rect x="810" y="320" width="250" height="46" rx="23" fill="#FFF9E8" stroke="#D4A921"/>
    <text x="935" y="350" text-anchor="middle">TS 初猜怎么构造？</text>
    <rect x="590" y="380" width="250" height="46" rx="23" fill="#FFF9E8" stroke="#D4A921"/>
    <text x="715" y="410" text-anchor="middle">结果对应目标化学状态吗？</text>
  </g>

  <!-- bottom banner -->
  <rect x="150" y="458" width="800" height="56" rx="10" fill="#194D36"/>
  <text x="550" y="493" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">复杂机理研究最困难的，往往不是"怎么算"，而是"应该算什么"</text>
</svg>
