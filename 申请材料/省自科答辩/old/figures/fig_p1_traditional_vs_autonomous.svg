<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>
  <rect width="1100" height="580" fill="#ffffff"/>

  <!-- left panel: traditional -->
  <rect x="40" y="70" width="480" height="420" rx="14" fill="#f6f6f6" stroke="#d5d5d5"/>
  <text x="280" y="106" font-size="21" font-weight="700" fill="#555" text-anchor="middle">传统计算科研</text>
  <g font-size="15.5" text-anchor="middle">
    <rect x="150" y="128" width="260" height="42" rx="8" fill="#ffffff" stroke="#bbb"/>
    <text x="280" y="155" fill="#333">科学问题</text>
    <rect x="150" y="188" width="260" height="42" rx="8" fill="#ffffff" stroke="#bbb"/>
    <text x="280" y="215" fill="#333">研究人员提出假设</text>
    <rect x="150" y="248" width="260" height="42" rx="8" fill="#ffffff" stroke="#bbb"/>
    <text x="280" y="275" fill="#333">研究人员建模</text>
    <rect x="150" y="308" width="260" height="42" rx="8" fill="#dde6ee" stroke="#9dbede"/>
    <text x="280" y="335" fill="#1f4e79" font-weight="600">计算机执行</text>
    <rect x="150" y="368" width="260" height="42" rx="8" fill="#ffffff" stroke="#bbb"/>
    <text x="280" y="395" fill="#333">研究人员判断</text>
  </g>
  <line x1="280" y1="170" x2="280" y2="188" stroke="#666" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="280" y1="230" x2="280" y2="248" stroke="#666" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="280" y1="290" x2="280" y2="308" stroke="#666" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="280" y1="350" x2="280" y2="368" stroke="#666" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M280,410 L280,440 L120,440 L120,209 L145,209" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a1)"/>
  <text x="200" y="430" font-size="13" fill="#888" text-anchor="middle">人工修改方案，循环往复</text>

  <!-- right panel: autonomous -->
  <rect x="580" y="70" width="480" height="420" rx="14" fill="#f2f7fc" stroke="#9dbede"/>
  <text x="820" y="106" font-size="21" font-weight="700" fill="#1f4e79" text-anchor="middle">自主科学计算</text>
  <g font-size="15.5" text-anchor="middle">
    <rect x="690" y="128" width="260" height="42" rx="8" fill="#ffffff" stroke="#9dbede"/>
    <text x="820" y="155" fill="#333">科学问题</text>
    <rect x="690" y="188" width="260" height="42" rx="8" fill="#fdebd7" stroke="#e07b00"/>
    <text x="820" y="215" fill="#8a5410">AI 提出候选假设</text>
    <rect x="690" y="248" width="260" height="42" rx="8" fill="#fdebd7" stroke="#e07b00"/>
    <text x="820" y="275" fill="#8a5410">AI + 工具建模</text>
    <rect x="690" y="308" width="260" height="42" rx="8" fill="#dde6ee" stroke="#9dbede"/>
    <text x="820" y="335" fill="#1f4e79" font-weight="600">计算机执行</text>
    <rect x="690" y="368" width="260" height="42" rx="8" fill="#fdebd7" stroke="#e07b00"/>
    <text x="820" y="395" fill="#8a5410">AI 判断结果</text>
  </g>
  <line x1="820" y1="170" x2="820" y2="188" stroke="#666" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="820" y1="230" x2="820" y2="248" stroke="#666" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="820" y1="290" x2="820" y2="308" stroke="#666" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="820" y1="350" x2="820" y2="368" stroke="#666" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M820,410 L820,440 L980,440 L980,209 L955,209" fill="none" stroke="#e07b00" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#a1)"/>
  <text x="900" y="430" font-size="13" fill="#e07b00" text-anchor="middle" font-weight="600">自动产生下一步研究任务</text>

  <!-- bottom banner -->
  <rect x="240" y="512" width="620" height="50" rx="10" fill="#1f4e79"/>
  <text x="550" y="544" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="700">从自动执行计算，走向自主探索科学问题</text>
</svg>
