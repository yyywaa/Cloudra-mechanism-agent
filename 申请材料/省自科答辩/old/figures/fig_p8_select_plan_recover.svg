<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr8" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1200" height="460" fill="#ffffff"/>

  <!-- legend -->
  <rect x="40" y="24" width="470" height="40" rx="8" fill="#fafafa" stroke="#e0e0e0"/>
  <rect x="54" y="34" width="18" height="18" rx="4" fill="#e07b00"/>
  <text x="80" y="48" font-size="15" fill="#333">LLM 决策点（仅此三处）</text>
  <rect x="270" y="34" width="18" height="18" rx="4" fill="#1f4e79"/>
  <text x="296" y="48" font-size="15" fill="#333">确定性程序执行</text>

  <!-- pipeline boxes: y=110 h=90 -->
  <!-- Generate -->
  <rect x="40" y="110" width="150" height="90" rx="12" fill="#1f4e79"/>
  <text x="115" y="148" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">Generate</text>
  <text x="115" y="174" font-size="13" fill="#cfe0f2" text-anchor="middle">机理候选生成</text>
  <!-- Select (LLM) -->
  <rect x="230" y="110" width="150" height="90" rx="12" fill="#e07b00"/>
  <text x="305" y="148" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">Select</text>
  <text x="305" y="174" font-size="13" fill="#ffe8cc" text-anchor="middle">候选筛选 · 保留竞争通道</text>
  <!-- Plan (LLM) -->
  <rect x="420" y="110" width="150" height="90" rx="12" fill="#e07b00"/>
  <text x="495" y="148" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">Plan</text>
  <text x="495" y="174" font-size="13" fill="#ffe8cc" text-anchor="middle">建模与计算策略</text>
  <!-- Execute -->
  <rect x="610" y="110" width="150" height="90" rx="12" fill="#1f4e79"/>
  <text x="685" y="148" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">Execute</text>
  <text x="685" y="174" font-size="13" fill="#cfe0f2" text-anchor="middle">工具执行 · 量子化学计算</text>
  <!-- Validate -->
  <rect x="800" y="110" width="150" height="90" rx="12" fill="#1f4e79"/>
  <text x="875" y="148" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">Validate</text>
  <text x="875" y="174" font-size="13" fill="#cfe0f2" text-anchor="middle">确定性科学校验</text>
  <!-- Recover (LLM) -->
  <rect x="990" y="110" width="150" height="90" rx="12" fill="#e07b00"/>
  <text x="1065" y="148" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">Recover</text>
  <text x="1065" y="174" font-size="13" fill="#ffe8cc" text-anchor="middle">异常诊断 · 路径修正</text>

  <!-- forward arrows -->
  <line x1="190" y1="155" x2="230" y2="155" stroke="#555" stroke-width="2.5" marker-end="url(#arr8)"/>
  <line x1="380" y1="155" x2="420" y2="155" stroke="#555" stroke-width="2.5" marker-end="url(#arr8)"/>
  <line x1="570" y1="155" x2="610" y2="155" stroke="#555" stroke-width="2.5" marker-end="url(#arr8)"/>
  <line x1="760" y1="155" x2="800" y2="155" stroke="#555" stroke-width="2.5" marker-end="url(#arr8)"/>
  <line x1="950" y1="155" x2="990" y2="155" stroke="#555" stroke-width="2.5" marker-end="url(#arr8)"/>

  <!-- mechanism graph box -->
  <rect x="420" y="290" width="340" height="76" rx="12" fill="#ffffff" stroke="#1f4e79" stroke-width="2"/>
  <text x="590" y="322" font-size="17" fill="#1f4e79" text-anchor="middle" font-weight="700">Mechanism Graph</text>
  <text x="590" y="346" font-size="13.5" fill="#4a6b8a" text-anchor="middle">科学状态唯一载体 · 证据绑定 · 跨 agent 共享</text>

  <!-- graph links -->
  <line x1="305" y1="200" x2="305" y2="328" stroke="#1f4e79" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr8)"/>
  <line x1="305" y1="328" x2="420" y2="328" stroke="#1f4e79" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="875" y1="200" x2="875" y2="328" stroke="#1f4e79" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr8)"/>
  <line x1="875" y1="328" x2="760" y2="328" stroke="#1f4e79" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- recover feedback loop -->
  <path d="M1065,200 L1065,250 L495,250 L495,205" fill="none" stroke="#e07b00" stroke-width="2.5" stroke-dasharray="8 5" marker-end="url(#arr8)"/>
  <text x="780" y="242" font-size="14" fill="#e07b00" text-anchor="middle" font-weight="600">规则治不了的异常 → 回到策略层重新决策</text>

  <!-- bottom captions -->
  <g font-size="14.5" fill="#666" text-anchor="middle">
    <text x="115" y="232">算法产生候选空间</text>
    <text x="305" y="232">智能在空间中选择</text>
    <text x="495" y="232">智能定策略</text>
    <text x="685" y="232">程序跑计算</text>
    <text x="875" y="232">程序判证据</text>
    <text x="1065" y="232">智能处理意外</text>
  </g>

  <text x="600" y="420" font-size="17" fill="#333" text-anchor="middle" font-weight="600">大模型负责"意外"与"选择"，不负责维持系统运行 —— Minimum Necessary Intelligence</text>
</svg>
