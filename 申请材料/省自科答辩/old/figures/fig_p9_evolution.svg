<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a9" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f4e79"/>
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="50" font-size="23" font-weight="700" fill="#222" text-anchor="middle">计算化学智能体的演进</text>

  <!-- ascending arrow -->
  <line x1="90" y1="500" x2="1030" y2="120" stroke="#c9d6e4" stroke-width="3" marker-end="url(#a9)"/>

  <!-- ground: traditional workflow -->
  <rect x="60" y="470" width="170" height="60" rx="10" fill="#f0f0f0" stroke="#ccc"/>
  <text x="145" y="495" font-size="15" fill="#666" text-anchor="middle" font-weight="600">传统自动工作流</text>
  <text x="145" y="517" font-size="12.5" fill="#999" text-anchor="middle">预设步骤自动执行</text>

  <!-- step 1: El Agente -->
  <rect x="270" y="380" width="190" height="86" rx="10" fill="#ffffff" stroke="#9dbede" stroke-width="1.8"/>
  <text x="365" y="406" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="700">El Agente</text>
  <text x="365" y="428" font-size="12.5" fill="#666" text-anchor="middle">2025-05</text>
  <text x="365" y="450" font-size="13" fill="#444" text-anchor="middle">LLM 自主编排量子化学工作流</text>

  <!-- step 2: CatDT -->
  <rect x="490" y="300" width="190" height="86" rx="10" fill="#ffffff" stroke="#9dbede" stroke-width="1.8"/>
  <text x="585" y="326" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="700">CatDT</text>
  <text x="585" y="348" font-size="12.5" fill="#666" text-anchor="middle">2026-06</text>
  <text x="585" y="370" font-size="13" fill="#444" text-anchor="middle">规则反应空间的自动探索</text>

  <!-- step 3: ARCHE -->
  <rect x="710" y="220" width="190" height="86" rx="10" fill="#ffffff" stroke="#9dbede" stroke-width="1.8"/>
  <text x="805" y="246" font-size="16.5" fill="#1f4e79" text-anchor="middle" font-weight="700">ARCHE</text>
  <text x="805" y="268" font-size="12.5" fill="#666" text-anchor="middle">2026-09</text>
  <text x="805" y="290" font-size="13" fill="#444" text-anchor="middle">自主提出并验证机理</text>

  <!-- step 4: Cloudra -->
  <rect x="920" y="120" width="170" height="100" rx="10" fill="#1f4e79"/>
  <text x="1005" y="150" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700">Cloudra</text>
  <text x="1005" y="174" font-size="12.5" fill="#cfe0f2" text-anchor="middle">本项目</text>
  <text x="1005" y="196" font-size="12.5" fill="#ffffff" text-anchor="middle">复杂三维有机机理的</text>
  <text x="1005" y="212" font-size="12.5" fill="#ffffff" text-anchor="middle">可验证自主解析</text>

  <!-- annotations -->
  <text x="585" y="420" font-size="13.5" fill="#888" text-anchor="middle">催化数字孪生 · harness 工程化</text>
  <text x="805" y="340" font-size="13.5" fill="#888" text-anchor="middle">三案例：立体控制 TS / 自由基路径 / 选择性描述符</text>

  <text x="550" y="545" font-size="15.5" fill="#666" text-anchor="middle">下一步：不是让大模型承担更多步骤，而是让系统更可靠、更可形式化、更适合复杂三维有机机理</text>
</svg>
