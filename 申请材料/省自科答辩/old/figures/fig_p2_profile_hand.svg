<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="ax" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#555"/>
    </marker>
    <marker id="barr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="rarr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- metaphor note -->
  <text x="88" y="66" font-size="15" fill="#999">山谷 = 反应物 / 中间体 / 产物　　山口 = 过渡态</text>

  <!-- axes -->
  <line x1="80" y1="470" x2="80" y2="44" stroke="#666" stroke-width="1.8" marker-end="url(#ax)"/>
  <line x1="80" y1="470" x2="950" y2="470" stroke="#666" stroke-width="1.8" marker-end="url(#ax)"/>
  <text x="30" y="258" font-size="15.5" fill="#444" transform="rotate(-90 30 258)" text-anchor="middle">电子能量 (kcal/mol)</text>
  <text x="515" y="512" font-size="15.5" fill="#444" text-anchor="middle">反应坐标</text>

  <!-- zero line -->
  <line x1="80" y1="353" x2="950" y2="353" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="7 5"/>
  <text x="88" y="347" font-size="12.5" fill="#aaa">0</text>

  <!-- energy profile -->
  <path d="M150,353 C210,353 265,184 330,184 C395,184 435,425 500,425 C565,425 615,76 680,76 C745,76 785,328 850,328"
        fill="none" stroke="#2f6fb2" stroke-width="3" stroke-linecap="round"/>

  <!-- TS1 barrier arrow -->
  <line x1="242" y1="353" x2="242" y2="184" stroke="#888" stroke-width="1.6" marker-start="url(#barr)" marker-end="url(#barr)"/>
  <text x="252" y="272" font-size="13" fill="#555">27.9</text>

  <!-- RDS arrow -->
  <line x1="762" y1="425" x2="762" y2="76" stroke="#c0392b" stroke-width="1.9" marker-start="url(#rarr)" marker-end="url(#rarr)"/>
  <text x="792" y="255" font-size="14.5" fill="#c0392b" font-weight="600">57.7（决速步）</text>

  <!-- stationary markers -->
  <g fill="#ffffff" stroke="#2f6fb2" stroke-width="2.5">
    <circle cx="150" cy="353" r="6.5"/>
    <circle cx="330" cy="184" r="6.5"/>
    <circle cx="500" cy="425" r="6.5"/>
    <circle cx="680" cy="76" r="6.5"/>
    <circle cx="850" cy="328" r="6.5"/>
  </g>

  <!-- labels -->
  <g text-anchor="middle" fill="#1f4e79">
    <text x="150" y="392" font-size="16.5" font-weight="700">RC</text>
    <text x="150" y="412" font-size="13">0</text>

    <text x="330" y="158" font-size="16.5" font-weight="700">TS1</text>
    <text x="330" y="140" font-size="13">27.9</text>

    <text x="472" y="424" font-size="16.5" font-weight="700" text-anchor="end">INT1</text>
    <text x="472" y="444" font-size="13" text-anchor="end">-11.9（羧醇胺中间体）</text>

    <text x="680" y="60" font-size="16.5" font-weight="700">TS2</text>

    <text x="850" y="366" font-size="16.5" font-weight="700">P</text>
    <text x="850" y="386" font-size="13">-4.1</text>
  </g>

  <!-- footer -->
  <text x="88" y="546" font-size="12.5" fill="#999">真实计算数据：甲醛 + 甲胺生成亚胺体系 · B3LYP-D3(BJ)/def2-SVP · Cloudra 自主交付（NI1）</text>
</svg>
