<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <g id="hex">
      <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" fill="none" stroke-width="2.5"/>
    </g>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>

  <!-- left: tidy network thumbnail -->
  <text x="220" y="90" font-size="19" font-weight="700" fill="#333" text-anchor="middle">反应拓扑</text>
  <g stroke="#1f4e79" stroke-width="2">
    <line x1="140" y1="240" x2="200" y2="300" marker-end="url(#a5)"/>
    <line x1="300" y1="240" x2="240" y2="300" marker-end="url(#a5)"/>
    <line x1="220" y1="330" x2="220" y2="390" marker-end="url(#a5)"/>
  </g>
  <g fill="#ffffff" stroke="#1f4e79" stroke-width="2">
    <circle cx="135" cy="225" r="16"/><circle cx="305" cy="225" r="16"/>
    <circle cx="220" cy="315" r="16" fill="#fdebd7" stroke="#e07b00"/>
    <circle cx="220" cy="405" r="16"/>
  </g>
  <text x="220" y="460" font-size="15" fill="#666" text-anchor="middle">"哪些键发生变化"</text>

  <!-- center arrow -->
  <line x1="380" y1="290" x2="500" y2="290" stroke="#666" stroke-width="3" marker-end="url(#a5)"/>
  <text x="440" y="272" font-size="15" fill="#666" text-anchor="middle">同一个拓扑</text>
  <text x="440" y="316" font-size="15" fill="#666" text-anchor="middle">大量三维实现</text>

  <!-- right: overlaid conformers (biphenyl-like, three dihedrals) -->
  <text x="790" y="90" font-size="19" font-weight="700" fill="#333" text-anchor="middle">三维化学空间</text>
  <g transform="translate(790,290)">
    <!-- conformer 3: near-perpendicular -->
    <g opacity="0.30" stroke="#7b5ea7">
      <use href="#hex" x="-55" y="0"/>
      <line x1="-32" y1="0" x2="32" y2="0" stroke-width="2.5"/>
      <use href="#hex" x="55" y="0" transform="scale(0.45 1) translate(67 0)"/>
    </g>
    <!-- conformer 2: tilted -->
    <g opacity="0.5" stroke="#e07b00" transform="rotate(18)">
      <use href="#hex" x="-55" y="0"/>
      <line x1="-32" y1="0" x2="32" y2="0" stroke-width="2.5"/>
      <g transform="translate(55 0) skewY(-12)"><use href="#hex"/></g>
    </g>
    <!-- conformer 1: planar -->
    <g opacity="0.85" stroke="#1f4e79">
      <use href="#hex" x="-55" y="0"/>
      <line x1="-32" y1="0" x2="32" y2="0" stroke-width="2.5"/>
      <use href="#hex" x="55" y="0"/>
    </g>
    <!-- rotation arrow -->
    <path d="M-10,-70 A72,72 0 0 1 55,-48" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#a5)"/>
    <text x="0" y="-82" font-size="14.5" fill="#c0392b" text-anchor="middle" font-weight="600">二面角旋转</text>
  </g>
  <g font-size="14.5" fill="#666" text-anchor="middle">
    <text x="620" y="440">构象</text>
    <text x="740" y="440">催化剂–底物取向</text>
    <text x="880" y="440">进攻方向</text>
    <text x="1000" y="440">立体化学</text>
  </g>

  <!-- bottom formula banner -->
  <rect x="180" y="486" width="740" height="54" rx="10" fill="#1f4e79"/>
  <text x="550" y="520" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">实际搜索空间 ≈ 机理空间 × 构象空间 × 初猜空间</text>
</svg>
