<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="670" viewBox="0 0 1100 670">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#52718f"/>
    </marker>
    <marker id="small-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8 Z" fill="#d08c21"/>
    </marker>
  </defs>
  <rect width="1100" height="670" fill="#fff"/>
  <rect x="20" y="22" width="346" height="535" rx="18" fill="#f7fafd" stroke="#d7e1ec" stroke-width="2"/>
  <text x="193" y="73" font-family="Arial Unicode MS" font-size="31" font-weight="bold" text-anchor="middle" fill="#1f4e79">反应路线</text>
  <text x="193" y="110" font-family="Arial Unicode MS" font-size="21" text-anchor="middle" fill="#596b7a">哪些状态彼此相连？</text>

  <path d="M193 181 L193 247" stroke="#52718f" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M193 315 L193 380" stroke="#52718f" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M240 283 C300 283 300 420 255 438" fill="none" stroke="#a4b6c9" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Arial Unicode MS" font-size="25" font-weight="bold" text-anchor="middle">
    <rect x="93" y="132" width="200" height="62" rx="15" fill="#e8f0fa" stroke="#2564a8" stroke-width="3"/>
    <text x="193" y="172" fill="#1f4e79">反应物</text>
    <rect x="93" y="255" width="200" height="62" rx="15" fill="#e8f0fa" stroke="#2564a8" stroke-width="3"/>
    <text x="193" y="295" fill="#1f4e79">中间体</text>
    <rect x="93" y="389" width="200" height="62" rx="15" fill="#fff2dd" stroke="#d69325" stroke-width="3"/>
    <text x="193" y="429" fill="#925b0d">目标产物</text>
    <rect x="183" y="469" width="151" height="58" rx="14" fill="#fff" stroke="#a4b6c9" stroke-width="3"/>
    <text x="259" y="507" fill="#596b7a">竞争产物</text>
  </g>

  <path d="M386 288 L466 288" stroke="#52718f" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="425" y="263" font-family="Arial Unicode MS" font-size="21" text-anchor="middle" fill="#596b7a">同一条路</text>
  <text x="425" y="333" font-family="Arial Unicode MS" font-size="21" text-anchor="middle" fill="#596b7a">多个姿态</text>

  <rect x="484" y="22" width="596" height="535" rx="18" fill="#f7fafd" stroke="#d7e1ec" stroke-width="2"/>
  <text x="782" y="73" font-family="Arial Unicode MS" font-size="31" font-weight="bold" text-anchor="middle" fill="#1f4e79">三维反应姿态</text>
  <text x="782" y="110" font-family="Arial Unicode MS" font-size="21" text-anchor="middle" fill="#596b7a">同一连接关系，仍要尝试不同空间排列</text>

  <g font-family="Arial Unicode MS" text-anchor="middle">
    <rect x="508" y="140" width="171" height="336" rx="15" fill="#fff" stroke="#d7e1ec" stroke-width="2"/>
    <rect x="696" y="140" width="171" height="336" rx="15" fill="#fff" stroke="#d7e1ec" stroke-width="2"/>
    <rect x="884" y="140" width="171" height="336" rx="15" fill="#fff" stroke="#d7e1ec" stroke-width="2"/>
    <text x="593" y="179" font-size="24" font-weight="bold" fill="#1f4e79">姿态 A</text>
    <text x="781" y="179" font-size="24" font-weight="bold" fill="#1f4e79">姿态 B</text>
    <text x="969" y="179" font-size="24" font-weight="bold" fill="#1f4e79">姿态 C</text>
  </g>

  <!-- Blue nodes denote an abstract catalyst site; orange nodes denote an abstract substrate. -->
  <g stroke="#2564a8" stroke-width="7" fill="#2564a8">
    <path d="M535 371 L593 329 L651 371" fill="none"/>
    <circle cx="593" cy="329" r="15"/>
    <path d="M723 371 L781 329 L839 371" fill="none"/>
    <circle cx="781" cy="329" r="15"/>
    <path d="M911 371 L969 329 L1027 371" fill="none"/>
    <circle cx="969" cy="329" r="15"/>
  </g>
  <g stroke="#d69325" stroke-width="7" fill="#d69325">
    <line x1="560" y1="240" x2="620" y2="264"/>
    <circle cx="560" cy="240" r="12"/><circle cx="620" cy="264" r="12"/>
    <line x1="738" y1="251" x2="800" y2="235"/>
    <circle cx="738" cy="251" r="12"/><circle cx="800" cy="235" r="12"/>
    <line x1="928" y1="246" x2="1003" y2="276"/>
    <circle cx="928" cy="246" r="12"/><circle cx="1003" cy="276" r="12"/>
  </g>
  <g stroke="#d08c21" stroke-width="3.5" stroke-dasharray="8 7" fill="none">
    <path d="M605 271 L596 307" marker-end="url(#small-arrow)"/>
    <path d="M790 247 L785 307" marker-end="url(#small-arrow)"/>
    <path d="M987 276 L974 307" marker-end="url(#small-arrow)"/>
  </g>
  <g font-family="Arial Unicode MS" font-size="20" text-anchor="middle" fill="#596b7a">
    <text x="593" y="421">不同构象</text>
    <text x="781" y="421">不同相对取向</text>
    <text x="969" y="421">不同进攻方向</text>
  </g>
  <rect x="64" y="588" width="972" height="58" rx="14" fill="#1f4e79"/>
  <text x="550" y="627" font-family="Arial Unicode MS" font-size="26" font-weight="bold" text-anchor="middle" fill="#fff">实际需要筛选：候选路径 × 分子构象 × 起始姿态</text>
</svg>
