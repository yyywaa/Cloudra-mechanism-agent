<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a11" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c0392b"/>
    </marker>
    <g id="hex11">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#ffffff" stroke="#1f4e79" stroke-width="2.5"/>
    </g>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>

  <!-- left: central chirality -->
  <rect x="60" y="70" width="440" height="380" rx="14" fill="#fafafa" stroke="#ddd"/>
  <text x="280" y="110" font-size="20" font-weight="700" fill="#333" text-anchor="middle">中心手性</text>
  <!-- tetrahedral carbon -->
  <circle cx="280" cy="260" r="7" fill="#333"/>
  <line x1="280" y1="260" x2="280" y2="170" stroke="#333" stroke-width="2.5"/>
  <text x="280" y="160" font-size="16" fill="#333" text-anchor="middle">R¹</text>
  <line x1="280" y1="260" x2="190" y2="310" stroke="#333" stroke-width="2.5"/>
  <text x="172" y="326" font-size="16" fill="#333" text-anchor="middle">R²</text>
  <polygon points="280,260 350,225 358,240" fill="#1f4e79"/>
  <text x="382" y="232" font-size="16" fill="#1f4e79" text-anchor="middle">R³</text>
  <g stroke="#7b5ea7" stroke-width="2.5">
    <line x1="283" y1="264" x2="289" y2="276"/>
    <line x1="290" y1="282" x2="296" y2="293"/>
    <line x1="297" y1="299" x2="303" y2="309"/>
    <line x1="304" y1="315" x2="310" y2="324"/>
  </g>
  <text x="322" y="346" font-size="16" fill="#7b5ea7" text-anchor="middle">R⁴</text>
  <text x="280" y="400" font-size="16" fill="#666" text-anchor="middle">局域手性中心 · R / S</text>
  <text x="280" y="428" font-size="14.5" fill="#999" text-anchor="middle">手性来自一个碳原子的取代基排列</text>

  <!-- right: axial chirality -->
  <rect x="600" y="70" width="440" height="380" rx="14" fill="#f2f7fc" stroke="#9dbede"/>
  <text x="820" y="110" font-size="20" font-weight="700" fill="#1f4e79" text-anchor="middle">轴手性</text>
  <!-- biaryl -->
  <use href="#hex11" x="740" y="250"/>
  <use href="#hex11" x="900" y="250"/>
  <line x1="766" y1="250" x2="874" y2="250" stroke="#1f4e79" stroke-width="3"/>
  <!-- ortho substituents -->
  <rect x="722" y="196" width="20" height="20" fill="#e07b00"/>
  <rect x="758" y="196" width="20" height="20" fill="#e07b00" opacity="0.65"/>
  <rect x="862" y="284" width="20" height="20" fill="#7b5ea7"/>
  <rect x="898" y="284" width="20" height="20" fill="#7b5ea7" opacity="0.65"/>
  <!-- rotation arrow around axis -->
  <path d="M812,180 A95,60 0 0 1 900,205" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#a11)"/>
  <text x="820" y="168" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="600">受阻旋转（旋转能垒）</text>
  <text x="820" y="400" font-size="16" fill="#666" text-anchor="middle">沿轴的整体排列 · Rₐ / Sₐ</text>
  <text x="820" y="428" font-size="14.5" fill="#999" text-anchor="middle">手性来自绕轴的受阻旋转</text>

  <!-- bottom banner -->
  <rect x="160" y="484" width="780" height="54" rx="10" fill="#1f4e79"/>
  <text x="550" y="518" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">轴手性：构象自由度本身就是立体化学变量</text>
</svg>
