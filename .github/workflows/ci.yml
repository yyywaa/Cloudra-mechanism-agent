name: CI

on:
  push:
    branches: [master, main, windows]
  pull_request:
    branches: [master, main, windows]

jobs:
  windows-smoke:
    # windows 分支的诚实护栏：平台敏感面（flocks msvcrt 后端、JS host 环境、
    # 配置 mutate）在真实 Windows runner 上过一遍。smoke 范围随移植进度扩展，
    # 新增 Windows 兼容修复必须连带把对应测试加进这里——否则兼容就是腐烂中的摆设。
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run ruff
        run: ruff check cloudra

      - name: Compile check
        run: python -m compileall -q cloudra

      - name: Run Windows-sensitive smoke tests
        run: |
          pytest tests/test_config_mutate.py -q
          pytest tests/test_runtime_v2_js_runtime.py -q -k host_env

  test:
    runs-on: ubuntu-latest
    # 任何测试挂起时 15 分钟快速失败，而不是空烧默认 6 小时
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run ruff
        run: ruff check cloudra

      - name: Run tests
        # faulthandler_timeout：单测超过 5 分钟自动 dump 所有线程堆栈，便于定位挂起
        # 覆盖率只在 3.11 这一格出：coverage 的 tracer 在 3.12 上对解析型用例慢
        # 3~4 倍（本机同一 venv：3.11 1m50s / 3.12 6m44s，去掉 --cov 则两版都
        # ~2min；COVERAGE_CORE=ctrace 无效），三格都出覆盖率会让 3.12 顶破 job
        # 超时。覆盖数字与解释器版本无关，出一格即可。
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pytest tests -q --cov=cloudra --cov-report=term-missing -o faulthandler_timeout=300
          else
            pytest tests -q -o faulthandler_timeout=300
          fi

      - name: Check imports
        run: |
          python -c "import cloudra; print(cloudra.__version__)"
          python -c "from cloudra import cli, runtime"
          python -c "from cloudra.core import agent"
          python -c "from cloudra.services import api_v2, session_store, nodes"
          python -c "from cloudra.persistence import database"
          python -c "from cloudra.core import message_history"
          python -c "from cloudra.base import session_class, tools_class"
          python -c "from cloudra.infra import config, flocks, logging_setup, llm_client"
          python -c "import cloudra.runtime_v2.schemas, cloudra.runtime_v2.core, cloudra.runtime_v2.commands, cloudra.runtime_v2.agent_host, cloudra.runtime_v2.apply, cloudra.runtime_v2.effects"
          python -c "import cloudra.dag.models, cloudra.dag.store, cloudra.dag.engine, cloudra.dag.controller"
          python -c "import cloudra.scheduler.daemon, cloudra.services.compute_store, cloudra.knowledge.health"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build
