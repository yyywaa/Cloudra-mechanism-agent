[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudra"
version = "2.0.0-beta"
description = "Autonomous agent for organic small-molecule mechanism computation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Cloudra Team"}
]
keywords = ["ai-agent", "organic-chemistry", "reaction-mechanism", "quantum-chemistry", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "platformdirs>=3.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "arxiv>=1.4",
    "httpx>=0.24",
    "certifi>=2024",
    "python-frontmatter>=1.0",
    "ase>=3.28.0",
    "cclib>=1.8.1",
    "aiosqlite>=0.20",
    "fastapi>=0.100.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.22.0",
    "tiktoken>=0.7.0",
    # benchmark 模块（cloudra/benchmark）的 GED 评分硬依赖；纯 Python 包
    "networkx>=3.0",
]

[project.optional-dependencies]
chem = [
    "rdkit>=2023.0",
    "molli>=1.3.0",
    "nmrglue>=0.10",
    "spectrochempy>=0.6.0",
    # chemcoord 2.2 改了内部模块结构，internal_coordinates 依赖其私有 API，钉在 2.1.x
    "chemcoord~=2.1.2",
    "pyscf>=2.4",
]
browser = [
    "playwright>=1.40",
]
pdf = [
    "pymupdf>=1.24.0",
]
visual = [
    "pymol-open-source>=3.0",
]
all = [
    "rdkit>=2023.0",
    "molli>=1.3.0",
    "nmrglue>=0.10",
    "spectrochempy>=0.6.0",
    "chemcoord~=2.1.2",
    "pyscf>=2.4",
    "playwright>=1.40",
    "pymupdf>=1.24.0",
    "pymol-open-source>=3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
cloudra = "cloudra.cli:main"

[project.urls]
Homepage = "https://github.com/yyywaa/Cloudra-mechanism-agent"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudra*"]
exclude = ["tests*", "test_*"]

# 运行时必需的非 Python 资源：prompts、技能文档、计算脚本。
# 缺失时 pip 安装的包会在 _load_prompt / skill_loader 处报 FileNotFoundError。
[tool.setuptools.package-data]
cloudra = ["prompts/*.md", "skills/**/*", "calculator.sh"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# no:dash — 用户级 site-packages 里残缺的 dash（pytest11 插件）会让收集阶段
# 直接 ImportError；本仓库不用 dash.testing，显式禁掉（无 dash 的机器无影响）。
addopts = "-q -p no:dash"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
