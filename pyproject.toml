[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudra"
version = "0.1.0rc1"
description = "Autonomous agent for organic small-molecule mechanism computation"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Cloudra Team"}
]
keywords = ["ai-agent", "organic-chemistry", "reaction-mechanism", "quantum-chemistry", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "platformdirs>=3.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "arxiv>=2.0",
    "httpx>=0.24",
    "certifi>=2024",
    "python-frontmatter>=1.0",
    "ase>=3.28.0",
    "cclib>=1.8.1",
    "aiosqlite>=0.20",
    "fastapi>=0.100.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.22.0",
    "tiktoken>=0.7.0",
    # benchmark 模块（cloudra/benchmark）的 GED 评分硬依赖；纯 Python 包
    "networkx>=3.0",
]

[project.optional-dependencies]
chem = [
    "rdkit>=2023.0",
    "molli>=1.3.0",
    "nmrglue>=0.10",
    "spectrochempy>=0.6.0",
    # internal_coordinates 使用 cc.Cartesian 公共 API，已验证 chemcoord 2.2 兼容
    "chemcoord>=2.1.2,<2.3.0",
    "pyscf>=2.4",
]
browser = [
    "playwright>=1.40",
]
pdf = [
    "pymupdf>=1.24.0",
]
visual = [
    "pymol-open-source>=3.0",
]
all = [
    "rdkit>=2023.0",
    "molli>=1.3.0",
    "nmrglue>=0.10",
    "spectrochempy>=0.6.0",
    "chemcoord>=2.1.2,<2.3.0",
    "pyscf>=2.4",
    "playwright>=1.40",
    "pymupdf>=1.24.0",
    "pymol-open-source>=3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[project.scripts]
cloudra = "cloudra.cli:main"

[project.urls]
Homepage = "https://github.com/yyywaa/Cloudra-mechanism-agent"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudra*"]
exclude = ["tests*", "test_*"]

# 运行时必需的非 Python 资源：prompts、技能文档、计算脚本。
# 缺失时 pip 安装的包会在 _load_prompt / skill_loader 处报 FileNotFoundError。
[tool.setuptools.package-data]
cloudra = [
    "prompts/*.md",
    "skills/**/*",
    "calculator.sh",
    "runtime_v2/js_host/*.mjs",
    "runtime_v2/js_host/package.json",
    "runtime_v2/js_host/package-lock.json",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# no:dash — 用户级 site-packages 里残缺的 dash（pytest11 插件）会让收集阶段
# 直接 ImportError；本仓库不用 dash.testing，显式禁掉（无 dash 的机器无影响）。
addopts = "-q -p no:dash"
markers = [
    "real_xtb: 真实 xTB 引擎验收（tests 默认把 xtb 藏出 PATH 走 IDPP 回退，带此标记的测试豁免）",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# This dated evidence bundle pins its scripts and source snapshots by SHA-256.
# Preserve those historical bytes; maintained code and other archives stay linted.
extend-exclude = ["gold_compute/organized_data/hard_20261001"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
